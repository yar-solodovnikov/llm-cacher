name: Publish to npm

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  # npm trusted publishing: the OIDC token proves this workflow is the configured publisher
  id-token: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  # onnxruntime-node (via @huggingface/transformers) downloads CUDA binaries from nuget.org on
  # install; CI has no GPU and uses the bundled CPU build, so skip it — a nuget outage broke npm ci
  ONNXRUNTIME_NODE_INSTALL: skip

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          registry-url: https://registry.npmjs.org

      - run: npm ci

      - run: npm run lint

      - run: npm test

      - run: npm run build

      - run: npm run test:dist

      # Trusted publishing needs npm 11.5.1+; an older npm would fail with an unhelpful 404
      - run: |
          node -e '
            const v = process.argv[1].split(".").map(Number)
            if (v[0] < 11 || (v[0] === 11 && (v[1] < 5 || (v[1] === 5 && v[2] < 1)))) {
              console.error(`npm ${process.argv[1]} is too old for trusted publishing (needs 11.5.1+)`)
              process.exit(1)
            }' "$(npm -v)"

      # No token: npm authenticates through OIDC (trusted publisher configured on npmjs.com)
      # and attaches provenance automatically
      - run: npm publish --access public
